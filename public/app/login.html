<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — IngressAI</title>
  <link rel="stylesheet" href="./styles.css" />
  <meta name="color-scheme" content="light" />
</head>
<body>
  <main class="card">
    <h1>Login</h1>
    <p>Digite o seu WhatsApp para receber o código de verificação.</p>

    <div class="row">
      <input id="phone" placeholder="55DDDSEUNUMERO" inputmode="numeric" autocomplete="tel" />
      <button id="btnSend">Enviar código</button>
    </div>

    <div class="row">
      <input id="code" placeholder="Código" inputmode="numeric" maxlength="6" />
      <button id="btnVerify">Entrar</button>
    </div>

    <p id="hint" class="muted"></p>
  </main>

  <script type="module" src="./login.js"></script>
</body>
</html>
