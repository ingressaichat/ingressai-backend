<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Validador — IngressAI</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    body{margin:0;font:16px/1.45 system-ui,Inter,Roboto,sans-serif;background:#0b1220;color:#fff}
    main{max-width:720px;margin:24px auto;padding:0 16px}
    .card{background:#111828;border:1px solid #1f2a44;border-radius:12px;padding:16px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
    .row{display:flex;gap:8px}
    input{flex:1;border-radius:10px;border:1px solid #2a3a5f;background:#0f172a;color:#fff;padding:.8rem .9rem}
    .btn{border-radius:10px;border:1px solid #2a3a5f;background:#1e293b;color:#fff;padding:.8rem 1rem;font-weight:700}
    .ok{color:#52e2a7}.bad{color:#ff9b9b}
  </style>
</head>
<body>
<main>
  <h2>Validador</h2>
  <div class="card">
    <div class="row">
      <input id="code" placeholder="Escaneie ou cole o código do ingresso" autofocus />
      <button id="check" class="btn">Validar</button>
    </div>
    <div id="hint" style="margin-top:10px;color:#9fb6ff">Aguardando…</div>
  </div>
</main>
<script>
(() => {
  const API = (location.origin + "/api"); // mesmo domínio (Railway)
  const $ = s => document.querySelector(s);

  async function check(){
    const code = ($("#code").value||"").trim();
    if (!code){ $("#hint").textContent = "Informe o código."; return; }
    $("#hint").textContent = "Validando…";
    try{
      const res = await fetch(`${API}/tickets/validate`,{
        method:"POST",
        credentials:"include",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ code })
      });
      const j = await res.json();
      if (!res.ok) throw new Error(j?.message||"inválido");
      $("#hint").innerHTML = `<strong class="ok">Válido</strong> — ${j.holder||"-"} • ${j.event||"-"}`;
    }catch(e){
      $("#hint").innerHTML = `<strong class="bad">Inválido</strong>`;
      console.error(e);
    }
  }

  $("#check").addEventListener("click", check);
  $("#code").addEventListener("keydown", e => { if (e.key==="Enter") check(); });
})();
</script>
</body>
</html>
