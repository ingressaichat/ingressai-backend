<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — IngressAI</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    body{margin:0;font:16px/1.45 system-ui,Segoe UI,Roboto,Inter,sans-serif;background:#f6f8fc;color:#0b1220}
    header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid #e7eefb;position:sticky;top:0}
    main{max-width:1100px;margin:24px auto;padding:0 16px}
    .card{background:#fff;border:1px solid #e7eefb;border-radius:12px;padding:16px;box-shadow:0 6px 18px rgba(47,125,217,.08)}
    .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:.6rem 1rem;border-radius:10px;border:1px solid #d6e4ff;background:#fff;font-weight:700}
    .muted{color:#5b6b86}
    table{width:100%;border-collapse:collapse}
    th,td{padding:8px;border-bottom:1px solid #eef2ff;text-align:left}
  </style>
</head>
<body>
<header>
  <strong>IngressAI • Dashboard</strong>
  <nav>
    <a class="btn" href="/app/validator.html">Validador</a>
  </nav>
</header>
<main>
  <section class="grid">
    <div class="card">
      <h3 style="margin:0 0 8px 0">Meus eventos</h3>
      <div id="ev-hint" class="muted">Carregando…</div>
      <table id="tbl-events" style="display:none">
        <thead><tr><th>Evento</th><th>Cidade</th><th>Data</th><th>Vendas</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="card">
      <h3 style="margin:0 0 8px 0">Resumo</h3>
      <div id="summary">—</div>
    </div>
  </section>
</main>
<script>
(async () => {
  const API = (location.origin + "/api"); // como está no mesmo domínio (Railway)
  const $ = (s, c=document)=>c.querySelector(s);

  function fmtBRL(n){ try{return (n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"})}catch{return "R$ 0,00"}}

  async function fetchJSON(url, opts={}){
    const res = await fetch(url, { credentials:"include", ...opts });
    if (!res.ok) throw new Error(res.status);
    return res.json();
  }

  try{
    const [{ items=[] }, stats] = await Promise.all([
      fetchJSON(`${API}/events/mine`),       // implemente no backend se não existir
      fetchJSON(`${API}/stats/overview`)     // idem
    ]);

    if (items.length){
      $("#tbl-events").style.display="table";
      $("#ev-hint").style.display="none";
      const tb = $("#tbl-events tbody");
      tb.innerHTML = items.map(ev => `
        <tr>
          <td>${ev.title||"-"}</td>
          <td>${ev.city||"-"}</td>
          <td>${ev.date_label||ev.date||"-"}</td>
          <td>${ev.sold||0} / ${ev.stock||0}</td>
        </tr>
      `).join("");
    } else {
      $("#ev-hint").textContent = "Nenhum evento ainda.";
    }

    $("#summary").textContent = `Receita total: ${fmtBRL(stats?.revenue||0)} • Ingressos: ${stats?.tickets||0}`;
  }catch(e){
    $("#ev-hint").textContent = "Erro ao carregar.";
    console.error(e);
  }
})();
</script>
</body>
</html>
